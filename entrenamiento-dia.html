<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrenamiento del Día</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark sticky-top">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🎯 Entrenamiento del Día</span>
            <div>
                <a href="index.html" class="btn btn-sm btn-outline-light">← Volver</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- SELECTOR DE DÍA -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">📅 Selecciona el Día</h5>
                    </div>
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-6">
                                <label for="dateSelect" class="form-label">Fecha</label>
                                <input type="date" class="form-control" id="dateSelect">
                            </div>
                            <div class="col-md-6">
                                <div style="margin-top: 32px;">
                                    <button class="btn btn-primary" id="todayBtn">📍 Hoy</button>
                                    <button class="btn btn-secondary" id="yesterdayBtn">← Ayer</button>
                                    <button class="btn btn-secondary" id="tomorrowBtn">Mañana →</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- PANEL COMPLETO: ENTRENAMIENTOS Y PROGRESO -->
            <div class="col-lg-12">
                <!-- FORMULARIO RÁPIDO PARA REGISTRAR ENTRENAMIENTO -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">📝 Registrar Entrenamiento Rápido</h5>
                    </div>
                    <div class="card-body">
                        <form id="quickTrainingForm">
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="quickExercise" class="form-label">Ejercicio</label>
                                    <input type="text" class="form-control" id="quickExercise" placeholder="ej: Press" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="quickSeries" class="form-label">Series x Reps</label>
                                    <input type="text" class="form-control" id="quickSeries" placeholder="ej: 5x5" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="quickWeight" class="form-label">Peso (kg)</label>
                                    <input type="number" class="form-control" id="quickWeight" step="0.5" required>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">✅ Registrar</button>
                        </form>
                    </div>
                </div>

                <!-- RESUMEN DEL DÍA -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">📈 Resumen del Entrenamiento</h5>
                    </div>
                    <div class="card-body" id="summaryPanel">
                        <p class="text-muted">Cargando...</p>
                    </div>
                </div>

                <!-- ENTRENAMIENTOS DE HOY -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">📊 Entrenamientos Registrados Hoy</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-striped table-sm" id="todayTable">
                            <thead class="table-dark">
                                <tr>
                                    <th>Ejercicio</th>
                                    <th>Series x Reps</th>
                                    <th>Peso</th>
                                    <th>1RM</th>
                                    <th>Volumen</th>
                                    <th>🗑</th>
                                </tr>
                            </thead>
                            <tbody id="todayTableBody">
                            </tbody>
                        </table>
                        <p id="emptyTodayMessage" class="text-muted text-center">No hay entrenamientos registrados hoy aún</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app-dia.js"></script>
</body>
</html>
